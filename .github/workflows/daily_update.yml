name: Mise à jour quotidienne du tableau de bord

# Déclenchement :
#   - automatique tous les jours à 17h00 UTC
#       = 18h heure française en hiver (UTC+1)
#       = 19h heure française en été (UTC+2)
#     Si l'on souhaite avoir 18h heure française toute l'année, il faudrait
#     deux crons (l'un en hiver à 17h UTC, l'autre en été à 16h UTC). Pour
#     éviter cette complexité, on a fixé l'heure à 17h UTC = 18h CET / 19h CEST.
#   - manuel via l'onglet "Actions" → "Run workflow"

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le pipeline
        env:
          CDSE_CLIENT_ID:        ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET:    ${{ secrets.CDSE_CLIENT_SECRET }}
          METEOFRANCE_API_KEY:   ${{ secrets.METEOFRANCE_API_KEY }}
          SHOM_API_KEY:          ${{ secrets.SHOM_API_KEY }}
          AIRBREIZH_WFS_URL:     ${{ secrets.AIRBREIZH_WFS_URL }}
          AIRBREIZH_LAYER:       ${{ secrets.AIRBREIZH_LAYER }}
        run: python src/run_pipeline.py

      - name: Committer les nouvelles données et le dashboard
        run: |
          git config user.name  "algues-vertes-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "Mise à jour automatique du $(date -u +%Y-%m-%d)"
            git pull origin main --no-rebase -X ours --no-edit
            git push
          fi
